
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>NFC Digital Card</title>

    <link rel="stylesheet" href="design.css">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>


<body>

    <!-- =================================
         OPTIONAL VIDEO BACKGROUND

         Delete this section if you only
         want to use a background picture.
    ================================== -->

    <!--
    <video class="background-video"
           autoplay
           muted
           loop
           playsinline>

        <source src="background.mp4"
                type="video/mp4">

    </video>
    -->


    <!-- =================================
         BACKGROUND OVERLAY
    ================================== -->

    <div class="background-overlay"></div>


    <!-- =================================
         MAIN MOBILE CARD
    ================================== -->

    <main class="mobile">


        <!-- =================================
             PROFILE
        ================================== -->

        <section class="profile">

            <img src="pf.png"
                 alt="Profile Picture"
                 class="profile-picture">

            <h1>
                Kristine Joy Angeles
            </h1>

            <p class="subtitle">
                
            </p>

        </section>


        <!-- =================================
             CONTENT
        ================================== -->

        <section class="content">


            <!-- =================================
                 ABOUT
            ================================== -->

            <div class="about">

                <h2>
                    Hello! 👋
                </h2>

                <p>
                    Welcome to my digital NFC card.
                    Connect with me using the links below.
                </p>

            </div>


            <!-- =================================
                 CONTACT / SOCIAL LINKS
            ================================== -->

            <div class="links">


                <!-- FACEBOOK -->
                <a href="https://www.facebook.com/kristine.joy.angeles.2024/"
                   target="_blank"
                   rel="noopener noreferrer"
                   class="button">

                    <i class="fa-brands fa-facebook"></i>

                    <span>
                        Facebook
                    </span>

                </a>


                <!-- INSTAGRAM -->
                <a href="https://www.instagram.com/_kristinejoyangeles"
                   target="_blank"
                   rel="noopener noreferrer"
                   class="button">

                    <i class="fa-brands fa-instagram"></i>

                    <span>
                        Instagram
                    </span>

                </a>


                <!-- =================================
                     GCASH
                ================================== -->

                <a href="#gcash"
                   class="button">

                    <i class="fa-solid fa-money-bill-transfer"></i>

                    <span>
                        Send via GCash
                    </span>

                </a>


            </div>

        </section>


        <!-- =================================
             FOOTER
        ================================== -->

        <footer>

            Tap • Connect • Share

        </footer>


    </main>


    <!-- =================================
         GCASH QR POPUP
    ================================== -->

    <div id="gcash"
         class="qr-modal">


        <!-- QR CARD -->

        <div class="qr-box">


            <!-- CLOSE BUTTON -->

            <a href="#"
               class="qr-close"
               aria-label="Close">

                &times;

            </a>


            <!-- TITLE -->

            <h2>
                GCash QR Code
            </h2>


            <!-- DESCRIPTION -->

            <p>
                Scan to send payment
            </p>


            <!-- =================================
                 CLIENT GCASH QR

                 Replace gcash-qr.png
                 with the client's QR.
            ================================== -->

            <img src="gcash-qr.png"
                 alt="PayMaya QR Code"
                 class="gcash-qr">


            <!-- CLIENT NAME -->

            <p class="gcash-name">
                Kristine Joy Angeles
            </p>


        </div>

    </div>

    <div id="gcash"
         class="qr-modal">


        <!-- QR CARD -->

        <div class="qr-box">


            <!-- CLOSE BUTTON -->

            <a href="#"
               class="qr-close"
               aria-label="Close">

                &times;

            </a>


            <!-- TITLE -->

            <h2>
                Union Bank QR Code
            </h2>


            <!-- DESCRIPTION -->

            <p>
                Scan to send payment
            </p>


            <!-- =================================
                 CLIENT GCASH QR

                 Replace gcash-qr.png
                 with the client's QR.
            ================================== -->

            <img src="union-qr.png"
                 alt="PayMaya QR Code"
                 class="gcash-qr">


            <!-- CLIENT NAME -->

            <p class="gcash-name">
                Kristine Joy Angeles
            </p>


        </div>

    </div>



</body>

</html>
